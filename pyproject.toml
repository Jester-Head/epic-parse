[project]
name = "epic-parse"
version = "0.4.0"
description = "Collect World of Warcraft community discussion (forums, Reddit, YouTube...) into Postgres"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "ftfy>=6.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
dev = ["pyright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["epic_parse*"]

[tool.pyright]
# Check against the project venv (same libraries as at runtime); run with: pyright epic_parse
venvPath = "."
venv = ".venv"
include = ["epic_parse"]
